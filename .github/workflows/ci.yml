name: CI

# Запуск: push в main при изменениях приложения или самого workflow + ручной запуск.
# Проверки выполняются в облаке, т.к. в среде Android/Acode нет shell (D-023).
on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: typecheck + build (Node 24)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js 24 LTS
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies (npm ci)
        run: npm ci --include=dev

      - name: Typecheck (react-router typegen + tsc)
        run: npm run typecheck

      - name: Production build (react-router build)
        run: npm run build
