name: Visual Preview

# Ручные скриншоты главной страницы без локального терминала (D-023).
# Запуск: вручную (workflow_dispatch) или при изменении этого файла.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/visual-preview.yml"

permissions:
  contents: read

concurrency:
  group: visual-preview-${{ github.ref }}
  cancel-in-progress: true

env:
  PLAYWRIGHT_VERSION: "1.65.0"
  # Фиксированный адрес dev-сервера: без разбора цветного вывода Vite.
  APP_HOST: "127.0.0.1"
  APP_PORT: "5173"
  APP_URL: "http://127.0.0.1:5173/"

jobs:
  screenshots:
    name: screenshots (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js 24 LTS
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies (npm ci)
        run: npm ci --include=dev

      - name: Start dev server
        env:
          # Отключаем цвет в логах: они читаются глазами, ANSI больше не нужен.
          FORCE_COLOR: "0"
          NO_COLOR: "1"
        run: |
          nohup npm run dev -- --host "${APP_HOST}" --port "${APP_PORT}" > dev-server.log 2>&1 &
          echo $! > dev-server.pid
          echo "Dev-сервер запущен в фоне (pid $(cat dev-server.pid)) на ${APP_URL}"

      # Проверка строго по фиксированному адресу. Никакого grep по логу.
      - name: Wait for HTTP 200
        run: |
          set -uo pipefail
          for attempt in $(seq 1 60); do
            if curl -fsS --max-time 10 "${APP_URL}" -o /dev/null; then
              echo "::notice title=dev-server::Отвечает ${APP_URL} (попытка ${attempt})"
              exit 0
            fi
            sleep 2
          done
          echo "::error title=dev-server::${APP_URL} не ответил за 120 секунд"
          echo "===== dev-server.log ====="
          tail -n 100 dev-server.log || true
          exit 1

      # Playwright ставится только в runner: в package.json не попадает.
      - name: Install Playwright Chromium
        run: npx --yes playwright@${PLAYWRIGHT_VERSION} install --with-deps chromium

      # Работаем от корня репозитория, чтобы пути совпадали с upload-artifact.
      - name: Take screenshots
        working-directory: .
        run: |
          set -euo pipefail
          mkdir -p apps/web/preview
          npx --yes playwright@${PLAYWRIGHT_VERSION} screenshot \
            --viewport-size="390,844" \
            --wait-for-timeout=2000 \
            "http://${APP_HOST}:${APP_PORT}/" \
            apps/web/preview/home-mobile-390x844.png
          npx --yes playwright@${PLAYWRIGHT_VERSION} screenshot \
            --viewport-size="1440,900" \
            --wait-for-timeout=2000 \
            "http://${APP_HOST}:${APP_PORT}/" \
            apps/web/preview/home-desktop-1440x900.png
          ls -la apps/web/preview

      # Отсутствие или пустота файла — явная ошибка, а не предупреждение.
      - name: Verify screenshots exist
        working-directory: .
        run: |
          set -euo pipefail
          for file in apps/web/preview/home-mobile-390x844.png apps/web/preview/home-desktop-1440x900.png; do
            if [ ! -s "$file" ]; then
              echo "::error title=screenshots::Файл отсутствует или пуст: $file"
              exit 1
            fi
            echo "ok: $file ($(wc -c < "$file") байт)"
          done

      - name: Show dev server log on failure
        if: failure()
        run: tail -n 150 dev-server.log || true

      - name: Stop dev server
        if: always()
        run: |
          if [ -f dev-server.pid ]; then
            kill "$(cat dev-server.pid)" 2>/dev/null || true
          fi

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: visual-preview-screenshots
          path: apps/web/preview/*.png
          if-no-files-found: error
          retention-days: 14
