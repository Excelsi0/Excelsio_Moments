name: Visual Preview

# Ручные скриншоты главной страницы без локального терминала (D-023).
# Запуск: вручную (workflow_dispatch) или при изменении этого файла —
# последнее нужно, чтобы первый прогон проверился в CI, а не «на словах».
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/visual-preview.yml"

permissions:
  contents: read

concurrency:
  group: visual-preview-${{ github.ref }}
  cancel-in-progress: true

env:
  PLAYWRIGHT_VERSION: "1.65.0"

jobs:
  screenshots:
    name: screenshots (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js 24 LTS
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies (npm ci)
        run: npm ci --include=dev

      - name: Start dev server
        run: |
          nohup npm run dev > dev-server.log 2>&1 &
          echo $! > dev-server.pid
          echo "Dev-сервер запущен в фоне (pid $(cat dev-server.pid))"

      # Vite печатает фактический адрес в лог: не полагаемся на угадывание порта.
      - name: Wait for HTTP 200
        run: |
          set -uo pipefail
          BASE_URL=""
          for _ in $(seq 1 60); do
            if [ -f dev-server.log ]; then
              CANDIDATE="$(grep -oE 'http://(localhost|127\.0\.0\.1):[0-9]+' dev-server.log | head -n 1 || true)"
              if [ -n "${CANDIDATE}" ] && curl -fsS --max-time 15 "${CANDIDATE}/" -o /dev/null; then
                BASE_URL="${CANDIDATE}"
                break
              fi
            fi
            sleep 2
          done
          if [ -z "${BASE_URL}" ]; then
            echo "::error title=dev-server::Dev-сервер не ответил за 120 секунд"
            tail -n 100 dev-server.log || true
            exit 1
          fi
          echo "BASE_URL=${BASE_URL}" >> "$GITHUB_ENV"
          echo "::notice title=dev-server::Готов: ${BASE_URL}"

      # Playwright ставится только в runner: в package.json не попадает.
      - name: Install Playwright Chromium
        run: npx --yes playwright@${PLAYWRIGHT_VERSION} install --with-deps chromium

      - name: Take screenshots
        run: |
          mkdir -p ../preview
          npx --yes playwright@${PLAYWRIGHT_VERSION} screenshot \
            --viewport-size="390,844" \
            --wait-for-timeout=2000 \
            "${BASE_URL}/" ../preview/home-mobile-390x844.png
          npx --yes playwright@${PLAYWRIGHT_VERSION} screenshot \
            --viewport-size="1440,900" \
            --wait-for-timeout=2000 \
            "${BASE_URL}/" ../preview/home-desktop-1440x900.png
          ls -la ../preview

      - name: Show dev server log on failure
        if: failure()
        run: tail -n 150 dev-server.log || true

      - name: Stop dev server
        if: always()
        run: |
          if [ -f dev-server.pid ]; then
            kill "$(cat dev-server.pid)" 2>/dev/null || true
          fi

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: visual-preview-screenshots
          path: preview/*.png
          if-no-files-found: warn
          retention-days: 14
